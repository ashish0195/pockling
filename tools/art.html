<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pockling art</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; } canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  // Renders the app icon, the share image, the wordmark and the store's images. tools/make-art.mjs screenshots these.
  import { Renderer, Assets } from '../web/src/gl.js';
  import { Pet } from '../web/src/pet.js';
  import { defineOutfits } from '../web/src/bake/outfits.js';
  import { defineFx } from '../web/src/bake/fx.js';
  import { makeCanvas } from '../web/src/bake/paint.js';

  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') ?? 'icon';
  const canvas = document.getElementById('c');
  const g = new Renderer(canvas);
  const assets = new Assets(g);
  defineOutfits(assets);
  defineFx(assets);
  const W = innerWidth;
  const H = innerHeight;
  g.resize(W, H, 1);

  const backdrop = (paint) => {
    const [c, x] = makeCanvas(W, H);
    paint(x);
    return g.texture(c, { mipmap: false, w: W, h: H });
  };
  const hearts = (x, list) => {
    for (const [px, py, s, col, rot] of list) {
      x.save();
      x.translate(px, py);
      x.rotate(rot ?? 0);
      x.fillStyle = col;
      x.beginPath();
      x.moveTo(0, s);
      x.bezierCurveTo(-s * 1.5, -s * 0.1, -s * 0.9, -s * 1.1, 0, -s * 0.4);
      x.bezierCurveTo(s * 0.9, -s * 1.1, s * 1.5, -s * 0.1, 0, s);
      x.fill();
      x.restore();
    }
  };

  const pets = [];
  const add = (spec, x, y, s, face, opts = {}) => {
    const pet = new Pet(assets, { seed: 11, stage: 'grown', outfit: {}, ...spec }, { prefix: `p${pets.length}`, bakeScale: 4 });
    pet.setFace(face);
    Object.assign(pet, opts);
    pet.settle();
    pet.blinkIn = 1e9;
    pet.lookIn = 1e9;
    pet.lookFree = [0, 0];
    pets.push({ pet, x, y, s });
    return pet;
  };

  let bg;
  if (mode === 'icon') {
    bg = backdrop((x) => {
      const r = x.createRadialGradient(W * 0.5, H * 0.42, W * 0.08, W * 0.5, H * 0.5, W * 0.8);
      r.addColorStop(0, '#ffe9dc');
      r.addColorStop(0.55, '#ffc4cf');
      r.addColorStop(1, '#ff8fb0');
      x.fillStyle = r;
      x.fillRect(0, 0, W, H);
      hearts(x, [[W * 0.14, H * 0.2, W * 0.05, 'rgba(255,255,255,0.55)', -0.3], [W * 0.87, H * 0.16, W * 0.065, 'rgba(255,255,255,0.6)', 0.3], [W * 0.92, H * 0.5, W * 0.03, 'rgba(255,255,255,0.45)', 0.2], [W * 0.07, H * 0.52, W * 0.025, 'rgba(255,255,255,0.45)', -0.2]]);
    });
    add({ breed: 'kitling', coat: q.get('coat') ?? 'peach' }, W * 0.5, H * 1.02, (W / 390) * 1.45, 'happy');
  } else if (mode === 'og') {
    bg = backdrop((x) => {
      const r = x.createLinearGradient(0, 0, W, H);
      r.addColorStop(0, '#ffe9d6');
      r.addColorStop(0.55, '#ffd2dd');
      r.addColorStop(1, '#dcd4ff');
      x.fillStyle = r;
      x.fillRect(0, 0, W, H);
      hearts(x, [[80, 90, 26, 'rgba(255,255,255,0.7)', -0.3], [1120, 70, 30, 'rgba(255,255,255,0.7)', 0.3], [1060, 300, 16, 'rgba(255,255,255,0.6)', 0.2], [150, 330, 15, 'rgba(255,255,255,0.6)', -0.2]]);
      x.textAlign = 'center';
      x.font = '118px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif';
      x.fillStyle = '#4a3540';
      x.fillText('Pockling', W / 2, 150);
      x.font = '34px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif';
      x.fillStyle = '#8a6775';
      x.fillText('A tiny friend who lives behind your screen', W / 2, 206);
    });
    add({ breed: 'drakling', coat: 'mint' }, 110, 612, 0.86, 'smile');
    add({ breed: 'puppling', coat: 'honey' }, 1092, 612, 0.86, 'happy');
    add({ breed: 'foxling', coat: 'ember' }, 324, 618, 1.02, 'joy');
    add({ breed: 'bunling', coat: 'lilac' }, 876, 618, 1.02, 'bliss');
    add({ breed: 'kitling', coat: 'peach' }, 600, 626, 1.34, 'happy');
  } else if (mode === 'header' || mode === 'search') {
    // The App Store's product page header and search results image: no prices, URLs or copyright marks.
    // The header says hello; the search image says what Pockling is, in the first screenshot's words.
    const wide = mode === 'header';
    const k = W / 3840;
    const title = wide ? ['Pockling'] : ['Your cute', 'virtual pet'];
    const line = wide ? 'A tiny friend who lives behind your screen' : 'Hatch it, cuddle it, feed it. No ads, ever.';
    bg = backdrop((x) => {
      const r = x.createLinearGradient(0, 0, W, H);
      r.addColorStop(0, '#ffe7d2');
      r.addColorStop(0.5, '#ffc9d8');
      r.addColorStop(1, '#d6ccff');
      x.fillStyle = r;
      x.fillRect(0, 0, W, H);
      const glow = x.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, W * 0.42);
      glow.addColorStop(0, 'rgba(255,248,240,0.85)');
      glow.addColorStop(1, 'rgba(255,248,240,0)');
      x.fillStyle = glow;
      x.fillRect(0, 0, W, H);
      const white = 'rgba(255,255,255,0.68)';
      hearts(x, [[W * 0.07, H * 0.2, 96 * k, white, -0.3], [W * 0.93, H * 0.17, 112 * k, white, 0.3], [W * 0.17, H * 0.1, 44 * k, white, 0.2], [W * 0.83, H * 0.36, 58 * k, white, -0.2], [W * 0.14, H * 0.4, 52 * k, white, 0.25], [W * 0.73, H * 0.09, 42 * k, white, -0.25]]);
      const titleY = H * (wide ? 0.2 : 0.135);
      const size = (wide ? 330 : 400) * k;
      const lead = size * 1.04;
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.lineJoin = 'round';
      x.font = `${size}px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif`;
      x.strokeStyle = '#fff';
      x.lineWidth = size * 0.17;
      // Every line's white edge first, so none covers the line above.
      title.forEach((text, i) => x.strokeText(text, W / 2, titleY + i * lead));
      title.forEach((text, i) => {
        const y = titleY + i * lead;
        const t = x.createLinearGradient(0, y - size * 0.4, 0, y + size * 0.4);
        t.addColorStop(0, '#ff8fb0');
        t.addColorStop(1, '#ff4f86');
        x.fillStyle = t;
        x.fillText(text, W / 2, y);
      });
      x.font = `${(wide ? 96 : 150) * k}px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif`;
      x.fillStyle = '#5a3f4c';
      x.fillText(line, W / 2, titleY + (title.length - 1) * lead + size * (wide ? 0.76 : 0.86));
    });
    const row = H * (wide ? 0.985 : 0.965);
    const big = wide ? 3.05 : 3.9;
    const [outer, inner] = wide ? [[1400, 0.74], [790, 0.86]] : [[1440, 0.7], [845, 0.86]];
    const faces = [['drakling', 'mint', 'smile', -1, outer], ['puppling', 'honey', 'happy', 1, outer], ['foxling', 'ember', 'joy', -1, inner], ['bunling', 'lilac', 'bliss', 1, inner], ['kitling', 'peach', 'happy', 0, [0, 1]]];
    for (const [breed, coat, face, side, [dx, size]] of faces) add({ breed, coat }, W / 2 + side * dx * k, row, big * size * k, face);
  } else if (mode === 'event-card' || mode === 'event-details') {
    // The Snow Festival's App Store in-app event images: the card (1920 x 1080) and the details page (1080 x 1920).
    // No words, prices or logos: the App Store sets the event's badge, name and description over the lower third
    // (and the app's icon in the card's top right corner), so the pets stand above that, on snow, in the game's own
    // winter hats and scarves, under festival lights.
    const tall = mode === 'event-details';
    const k = Math.min(W, H) / 1080;
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const groundY = H * (tall ? 0.54 : 0.58);
    bg = backdrop((x) => {
      const sky = x.createLinearGradient(0, 0, 0, groundY);
      sky.addColorStop(0, '#4f4fa6');
      sky.addColorStop(0.5, '#8f86d9');
      sky.addColorStop(1, '#f2c6de');
      x.fillStyle = sky;
      x.fillRect(0, 0, W, H);
      const glow = x.createRadialGradient(W / 2, groundY - 80 * k, 0, W / 2, groundY - 80 * k, Math.max(W, H) * 0.55);
      glow.addColorStop(0, 'rgba(255,240,246,0.9)');
      glow.addColorStop(0.45, 'rgba(255,225,238,0.35)');
      glow.addColorStop(1, 'rgba(255,225,238,0)');
      x.fillStyle = glow;
      x.fillRect(0, 0, W, H);
      // Far snowy hills, then the snow the pets stand on.
      const hills = (y, amp, color, phase) => {
        x.fillStyle = color;
        x.beginPath();
        x.moveTo(0, H);
        for (let i = 0; i <= 48; i++) {
          const px = (W * i) / 48;
          x.lineTo(px, y + Math.sin(i * 0.55 + phase) * amp + Math.sin(i * 0.21 + phase * 2) * amp * 0.8);
        }
        x.lineTo(W, H);
        x.closePath();
        x.fill();
      };
      hills(groundY - (tall ? 210 : 70) * k, 16 * k, '#ddd4f4', 0.4);
      hills(groundY - (tall ? 150 : 26) * k, 12 * k, '#efe9fb', 2.1);
      const snow = x.createLinearGradient(0, groundY, 0, H);
      snow.addColorStop(0, '#ffffff');
      snow.addColorStop(1, '#e6e1f6');
      x.fillStyle = snow;
      x.beginPath();
      x.moveTo(0, H);
      x.lineTo(0, groundY + 10 * k);
      x.bezierCurveTo(W * 0.3, groundY - 22 * k, W * 0.7, groundY - 22 * k, W, groundY + 10 * k);
      x.lineTo(W, H);
      x.closePath();
      x.fill();
      // Festival lights on a sagging string across the top.
      const wireY = H * (tall ? 0.08 : 0.05);
      const sag = (tall ? 90 : 80) * k;
      const wire = (t) => [W * -0.04 + t * W * 1.08, wireY + Math.sin(Math.PI * t) * sag];
      x.strokeStyle = 'rgba(60,45,90,0.55)';
      x.lineWidth = 3 * k;
      x.beginPath();
      for (let i = 0; i <= 60; i++) {
        const [px, py] = wire(i / 60);
        if (i === 0) x.moveTo(px, py); else x.lineTo(px, py);
      }
      x.stroke();
      const bulbs = ['#ffd76b', '#ff9cc0', '#8fe3c8', '#9ccaff', '#ffb27a'];
      const count = tall ? 9 : 15;
      for (let i = 1; i < count; i++) {
        const [px, py] = wire(i / count);
        const col = bulbs[i % bulbs.length];
        const halo = x.createRadialGradient(px, py + 14 * k, 0, px, py + 14 * k, 46 * k);
        halo.addColorStop(0, col + 'cc');
        halo.addColorStop(1, col + '00');
        x.fillStyle = halo;
        x.fillRect(px - 50 * k, py - 36 * k, 100 * k, 100 * k);
        x.fillStyle = col;
        x.beginPath();
        x.ellipse(px, py + 16 * k, 9 * k, 13 * k, 0, 0, Math.PI * 2);
        x.fill();
        x.fillStyle = 'rgba(70,55,100,0.8)';
        x.fillRect(px - 5 * k, py, 10 * k, 6 * k);
      }
      // Falling snow: soft flakes, bigger ones nearer.
      for (let i = 0; i < (tall ? 190 : 220); i++) {
        const px = rnd() * W;
        const py = rnd() * H;
        const r = (2 + rnd() * rnd() * 9) * k;
        const flake = x.createRadialGradient(px, py, 0, px, py, r);
        flake.addColorStop(0, 'rgba(255,255,255,0.95)');
        flake.addColorStop(0.6, 'rgba(255,255,255,0.7)');
        flake.addColorStop(1, 'rgba(255,255,255,0)');
        x.fillStyle = flake;
        x.beginPath();
        x.arc(px, py, r, 0, Math.PI * 2);
        x.fill();
      }
    });
    // Side by side on the wide card; on the tall page the two friends stand a step back, up the slope.
    const feet = groundY + (tall ? 40 : 22) * k;
    const big = (tall ? 1.8 : 1.65) * k;
    const [gap, back, small] = tall ? [300 * k, 150 * k, 0.68] : [470 * k, 0, 0.8];
    const crew = [
      [{ breed: 'foxling', coat: 'ember', outfit: { head: 'beanie', neck: 'scarf' } }, -1, 'happy'],
      [{ breed: 'bunling', coat: 'lilac', outfit: { head: 'beanie', neck: 'scarf' } }, 1, 'bliss'],
      [{ breed: 'kitling', coat: 'peach', outfit: { head: 'santa', neck: 'scarf' } }, 0, 'joy'],
    ];
    for (const [spec, side, face] of crew) {
      add(spec, W / 2 + side * gap, feet - (side ? back + 6 * k : 0), big * (side ? small : 1), face);
    }
  } else if (mode === 'word') {
    canvas.style.display = 'none';
    document.documentElement.style.background = 'transparent';
    document.body.style.background = 'transparent';
    const [c, x] = makeCanvas(W, H);
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.font = `${H * 0.66}px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif`;
    x.lineJoin = 'round';
    x.strokeStyle = '#fff';
    x.lineWidth = H * 0.14;
    x.strokeText('Pockling', W / 2, H * 0.54);
    const t = x.createLinearGradient(0, H * 0.2, 0, H * 0.85);
    t.addColorStop(0, '#ff8fb0');
    t.addColorStop(1, '#ff5f8d');
    x.fillStyle = t;
    x.fillText('Pockling', W / 2, H * 0.54);
    c.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh';
    document.body.append(c);
    window.__ready = true;
  } else if (mode === 'marks') {
    bg = null;
  }

  if (mode !== 'word') {
    const draw = () => {
      g.begin(1, 1, 1);
      if (bg) g.sprite(bg, 0, 0, { ax: 0, ay: 0, w: W, h: H });
      for (const { pet, x, y, s } of pets) {
        g.sprite(assets.get('fx.shadow'), x, y + 4 * s, { w: 236 * s * pet.stage.scale, h: 50 * s * pet.stage.scale, alpha: 0.75 });
        pet.draw(g, x, y, s, [1, 1, 1]);
      }
      g.end();
    };
    let n = 0;
    const loop = () => {
      draw();
      n += 1;
      if (n < 5) requestAnimationFrame(loop);
      else window.__ready = true;
    };
    loop();
  }
</script>
</body>
</html>
