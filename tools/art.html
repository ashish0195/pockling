<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pockling art</title>
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; } canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  // Renders the app icon, the share image and the wordmark. tools/make-art.mjs screenshots these.
  import { Renderer, Assets } from '../web/src/gl.js';
  import { Pet } from '../web/src/pet.js';
  import { defineOutfits } from '../web/src/bake/outfits.js';
  import { defineFx } from '../web/src/bake/fx.js';
  import { makeCanvas } from '../web/src/bake/paint.js';

  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') ?? 'icon';
  const canvas = document.getElementById('c');
  const g = new Renderer(canvas);
  const assets = new Assets(g);
  defineOutfits(assets);
  defineFx(assets);
  const W = innerWidth;
  const H = innerHeight;
  g.resize(W, H, 1);

  const backdrop = (paint) => {
    const [c, x] = makeCanvas(W, H);
    paint(x);
    return g.texture(c, { mipmap: false, w: W, h: H });
  };
  const hearts = (x, list) => {
    for (const [px, py, s, col, rot] of list) {
      x.save();
      x.translate(px, py);
      x.rotate(rot ?? 0);
      x.fillStyle = col;
      x.beginPath();
      x.moveTo(0, s);
      x.bezierCurveTo(-s * 1.5, -s * 0.1, -s * 0.9, -s * 1.1, 0, -s * 0.4);
      x.bezierCurveTo(s * 0.9, -s * 1.1, s * 1.5, -s * 0.1, 0, s);
      x.fill();
      x.restore();
    }
  };

  const pets = [];
  const add = (spec, x, y, s, face, opts = {}) => {
    const pet = new Pet(assets, { seed: 11, stage: 'grown', outfit: {}, ...spec }, { prefix: `p${pets.length}`, bakeScale: 4 });
    pet.setFace(face);
    Object.assign(pet, opts);
    pet.settle();
    pet.blinkIn = 1e9;
    pet.lookIn = 1e9;
    pet.lookFree = [0, 0];
    pets.push({ pet, x, y, s });
    return pet;
  };

  let bg;
  if (mode === 'icon') {
    bg = backdrop((x) => {
      const r = x.createRadialGradient(W * 0.5, H * 0.42, W * 0.08, W * 0.5, H * 0.5, W * 0.8);
      r.addColorStop(0, '#ffe9dc');
      r.addColorStop(0.55, '#ffc4cf');
      r.addColorStop(1, '#ff8fb0');
      x.fillStyle = r;
      x.fillRect(0, 0, W, H);
      hearts(x, [[W * 0.14, H * 0.2, W * 0.05, 'rgba(255,255,255,0.55)', -0.3], [W * 0.87, H * 0.16, W * 0.065, 'rgba(255,255,255,0.6)', 0.3], [W * 0.92, H * 0.5, W * 0.03, 'rgba(255,255,255,0.45)', 0.2], [W * 0.07, H * 0.52, W * 0.025, 'rgba(255,255,255,0.45)', -0.2]]);
    });
    add({ breed: 'kitling', coat: q.get('coat') ?? 'peach' }, W * 0.5, H * 1.02, (W / 390) * 1.45, 'happy');
  } else if (mode === 'og') {
    bg = backdrop((x) => {
      const r = x.createLinearGradient(0, 0, W, H);
      r.addColorStop(0, '#ffe9d6');
      r.addColorStop(0.55, '#ffd2dd');
      r.addColorStop(1, '#dcd4ff');
      x.fillStyle = r;
      x.fillRect(0, 0, W, H);
      hearts(x, [[80, 90, 26, 'rgba(255,255,255,0.7)', -0.3], [1120, 70, 30, 'rgba(255,255,255,0.7)', 0.3], [1060, 300, 16, 'rgba(255,255,255,0.6)', 0.2], [150, 330, 15, 'rgba(255,255,255,0.6)', -0.2]]);
      x.textAlign = 'center';
      x.font = '118px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif';
      x.fillStyle = '#4a3540';
      x.fillText('Pockling', W / 2, 150);
      x.font = '34px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif';
      x.fillStyle = '#8a6775';
      x.fillText('A tiny friend who lives behind your screen', W / 2, 206);
    });
    add({ breed: 'drakling', coat: 'mint' }, 110, 612, 0.86, 'smile');
    add({ breed: 'puppling', coat: 'honey' }, 1092, 612, 0.86, 'happy');
    add({ breed: 'foxling', coat: 'ember' }, 324, 618, 1.02, 'joy');
    add({ breed: 'bunling', coat: 'lilac' }, 876, 618, 1.02, 'bliss');
    add({ breed: 'kitling', coat: 'peach' }, 600, 626, 1.34, 'happy');
  } else if (mode === 'header' || mode === 'search') {
    // The App Store's product page header and search results image: no prices, URLs or copyright marks.
    const wide = mode === 'header';
    const k = W / 3840;
    bg = backdrop((x) => {
      const r = x.createLinearGradient(0, 0, W, H);
      r.addColorStop(0, '#ffe7d2');
      r.addColorStop(0.5, '#ffc9d8');
      r.addColorStop(1, '#d6ccff');
      x.fillStyle = r;
      x.fillRect(0, 0, W, H);
      const glow = x.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, W * 0.42);
      glow.addColorStop(0, 'rgba(255,248,240,0.85)');
      glow.addColorStop(1, 'rgba(255,248,240,0)');
      x.fillStyle = glow;
      x.fillRect(0, 0, W, H);
      const white = 'rgba(255,255,255,0.68)';
      hearts(x, [[W * 0.07, H * 0.2, 96 * k, white, -0.3], [W * 0.93, H * 0.17, 112 * k, white, 0.3], [W * 0.17, H * 0.1, 44 * k, white, 0.2], [W * 0.83, H * 0.36, 58 * k, white, -0.2], [W * 0.14, H * 0.4, 52 * k, white, 0.25], [W * 0.73, H * 0.09, 42 * k, white, -0.25]]);
      const titleY = H * (wide ? 0.2 : 0.21);
      const size = (wide ? 330 : 480) * k;
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.lineJoin = 'round';
      x.font = `${size}px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif`;
      x.strokeStyle = '#fff';
      x.lineWidth = size * 0.17;
      x.strokeText('Pockling', W / 2, titleY);
      const t = x.createLinearGradient(0, titleY - size * 0.4, 0, titleY + size * 0.4);
      t.addColorStop(0, '#ff8fb0');
      t.addColorStop(1, '#ff4f86');
      x.fillStyle = t;
      x.fillText('Pockling', W / 2, titleY);
      x.font = `${(wide ? 96 : 150) * k}px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif`;
      x.fillStyle = '#5a3f4c';
      x.fillText(wide ? 'A tiny friend who lives behind your screen' : 'Hatch it. Love it. Tuck it in.', W / 2, titleY + size * (wide ? 0.76 : 0.82));
    });
    const row = H * (wide ? 0.985 : 0.965);
    const big = wide ? 3.05 : 3.9;
    const [outer, inner] = wide ? [[1400, 0.74], [790, 0.86]] : [[1440, 0.7], [845, 0.86]];
    const faces = [['drakling', 'mint', 'smile', -1, outer], ['puppling', 'honey', 'happy', 1, outer], ['foxling', 'ember', 'joy', -1, inner], ['bunling', 'lilac', 'bliss', 1, inner], ['kitling', 'peach', 'happy', 0, [0, 1]]];
    for (const [breed, coat, face, side, [dx, size]] of faces) add({ breed, coat }, W / 2 + side * dx * k, row, big * size * k, face);
  } else if (mode === 'word') {
    canvas.style.display = 'none';
    document.documentElement.style.background = 'transparent';
    document.body.style.background = 'transparent';
    const [c, x] = makeCanvas(W, H);
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.font = `${H * 0.66}px "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif`;
    x.lineJoin = 'round';
    x.strokeStyle = '#fff';
    x.lineWidth = H * 0.14;
    x.strokeText('Pockling', W / 2, H * 0.54);
    const t = x.createLinearGradient(0, H * 0.2, 0, H * 0.85);
    t.addColorStop(0, '#ff8fb0');
    t.addColorStop(1, '#ff5f8d');
    x.fillStyle = t;
    x.fillText('Pockling', W / 2, H * 0.54);
    c.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh';
    document.body.append(c);
    window.__ready = true;
  } else if (mode === 'marks') {
    bg = null;
  }

  if (mode !== 'word') {
    const draw = () => {
      g.begin(1, 1, 1);
      if (bg) g.sprite(bg, 0, 0, { ax: 0, ay: 0, w: W, h: H });
      for (const { pet, x, y, s } of pets) {
        g.sprite(assets.get('fx.shadow'), x, y + 4 * s, { w: 236 * s * pet.stage.scale, h: 50 * s * pet.stage.scale, alpha: 0.75 });
        pet.draw(g, x, y, s, [1, 1, 1]);
      }
      g.end();
    };
    let n = 0;
    const loop = () => {
      draw();
      n += 1;
      if (n < 5) requestAnimationFrame(loop);
      else window.__ready = true;
    };
    loop();
  }
</script>
</body>
</html>
